<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zalando Hide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 280px;
      padding: 16px;
      background: #fff;
      color: #1a1a1a;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #count {
      font-size: 36px;
      font-weight: 700;
      color: #ff6900;
      line-height: 1;
    }
    #count-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 14px;
      margin-top: 2px;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      background: #f5f5f5;
      color: #333;
      transition: background 0.1s;
    }
    .btn:hover { background: #e8e8e8; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    #hidden-list {
      margin-top: 12px;
      max-height: 220px;
      overflow-y: auto;
      border-top: 1px solid #eee;
    }
    .item-row {
      display: flex;
      align-items: center;
      padding: 6px 0;
      font-size: 12px;
      border-bottom: 1px solid #f5f5f5;
      gap: 8px;
    }
    .item-id {
      flex: 1;
      color: #444;
      font-family: monospace;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-restore-one {
      flex-shrink: 0;
      padding: 3px 8px;
      width: auto;
      font-size: 11px;
      border-radius: 4px;
    }
    #empty-msg {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <h1>Zalando Hide</h1>
  <div id="count">0</div>
  <div id="count-label">hidden products</div>
  <button class="btn" id="restore-all">Restore all</button>
  <div id="hidden-list"></div>
  <script src="popup.js"></script>
</body>
</html>
